services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: laravel-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: laravel-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  # Local embedding model (BAAI bge-small, 384 dimensions) served by Hugging Face TEI.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: laravel-rag-embeddings
    command: --model-id BAAI/bge-small-en-v1.5 --auto-truncate
    ports:
      - "8081:80"
    volumes:
      - tei_models:/data

  # Local cross-encoder (MiniLM) that rereads the top hybrid-search hits.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: laravel-rag-reranker
    command: --model-id cross-encoder/ms-marco-MiniLM-L-6-v2 --auto-truncate
    ports:
      - "8082:80"
    volumes:
      - tei_models:/data

volumes:
  qdrant_storage:
  ollama_storage:
  tei_models:
